<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataProcessor</title><link rel="stylesheet" href="/styles.css"></head><body>
<main><header><div><p class="eyebrow">PIPER · LEROBOT</p><h1>DataProcessor</h1><p class="subtitle">HDF5 → 降采样 → 动作表示 → LeRobot v3</p></div><div class="status-wrap"><span id="status" class="badge">空闲</span><span id="elapsed" class="muted">未开始</span></div></header>
<div class="layout"><section class="content"><section class="card"><div class="card-title"><h2>处理配置</h2><span class="step">1 / 2</span></div><label>输入 HDF5 目录<input id="input" type="text"></label><label>输出目录（留空自动生成）<input id="output" type="text" placeholder="自动生成"></label><div class="row"><label>源 FPS <span class="optional">留空自动检测</span><input id="source" type="number" min="1" placeholder="自动检测"></label><label>目标 FPS<select id="fps"><option>20</option><option>10</option><option>5</option><option>4</option><option>2</option><option>1</option></select></label></div><label>任务描述<textarea id="task" rows="2"></textarea></label><label>动作表示<select id="mode"><option value="absolute">绝对关节动作</option><option value="delta_joint">增量关节动作（降采样后 t+1 − t）</option></select></label><div class="actions"><button id="inspect" class="secondary">检查输入</button><button id="start">开始处理</button><button id="cancel" class="danger hidden">取消处理</button></div><p class="hint">目标 FPS 必须整除每个 HDF5 的实际源 FPS。开始后配置会锁定，避免重复处理。</p></section><section id="plan" class="card hidden"><div class="card-title"><h2>输入检查</h2><span id="plan-summary" class="muted"></span></div><pre id="plantext"></pre></section><section class="card progress-card"><div class="card-title"><h2>当前进度</h2><span id="phase" class="phase">等待开始</span></div><div class="big-progress"><i id="bar"></i></div><div class="progress-numbers"><strong id="episode-count">0 / 0 条</strong><strong id="frame-count">—</strong></div><p id="message" class="message">先检查输入，然后开始处理</p><div class="stats"><div><span>已用时间</span><strong id="time">—</strong></div><div><span>预计剩余</span><strong id="eta">—</strong></div><div><span>输出帧数</span><strong id="total-frames">—</strong></div></div><div id="result" class="result hidden"></div></section></section><aside class="logs card"><div class="card-title"><h2>实时日志</h2><button id="clear-log" class="tiny">清空</button></div><div id="log" class="log" aria-live="polite"><p class="log-empty">处理日志会显示在这里</p></div></aside></div></main><script src="/app.js"></script></body></html>
