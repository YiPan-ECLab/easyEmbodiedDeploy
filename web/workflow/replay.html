<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工作流运行记录 · 关节回放</title><link rel="stylesheet" href="shared.css"><style>body{max-width:1440px;margin:auto;padding:24px;background:#f5f7f7;color:#213a3e;font:15px/1.6 system-ui,sans-serif}header{display:block}h1{font-size:26px}select,input,button{font:inherit;padding:8px}header,.controls,.card{background:white;border:1px solid #dbe4e3;border-radius:12px;padding:18px;margin-bottom:16px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}#runs{min-width:320px;max-width:100%}#charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}canvas{width:100%;height:220px;background:white;border:1px solid #dbe4e3;border-radius:8px}#scrub{width:100%;padding:0}#error{color:#b44736}#readout{white-space:pre-wrap;font-variant-numeric:tabular-nums}#events{max-height:320px;overflow:auto;white-space:pre-wrap}.note{color:#60757a;font-size:13px}@media(max-width:750px){#charts{grid-template-columns:1fr}}</style></head><body><header><h1>工作流运行记录 · 关节回放</h1><p>历史运行的实际关节反馈与法兰位置。回放仅查看数据，不会向机械臂发送动作。</p><div class="toolbar"><label>选择运行 <select id="runs"></select></label><button id="refresh">刷新记录</button><a id="csv" download>下载完整 CSV</a><a id="raw" download>原始采样 JSONL</a><a id="judgments" download>触发判断 JSONL</a></div><p id="meta"></p><p id="error" role="alert"></p></header><section class="controls"><div class="toolbar"><label>显示从臂 <select id="side"><option value="right">右臂</option><option value="left">左臂</option><option value="both">双臂</option></select></label><button id="play">播放</button><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><strong id="time"></strong></div><input id="scrub" aria-label="回放时间" type="range" min="0" max="1000" value="0"><div id="readout"></div><p class="note">横轴是从运行准备开始经过的实际秒数；“VLA运行时钟”在首个动作就绪时起算、暂停时冻结。关节单位为度，法兰位置为各自基座系毫米，不含夹爪 TCP 偏移。缺失反馈显示为曲线断点。红虚线是本次规则的 J6 或 J4＋J6 合计 / Z 下限；紫虚线为高位独立触发下限（启用时显示）；条件是否触发以独立判断日志为准。</p></section><section id="charts"></section><section class="card"><h2>运行事件</h2><div id="events"></div></section><script src="replay.js"></script></body></html>
