<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型与数据目录</title><link rel="stylesheet" href="shared.css"></head><body><main>
<header><div><div class="eyebrow">WORKSPACE / RESOURCES</div><h1>模型与数据目录</h1><p class="muted">浏览资源、整理目录，一键复制到训练和数据处理页面。</p></div><div class="row"><button id="refresh">刷新</button><button id="trash-toggle">回收站</button></div></header>
<section class="card"><div class="row spread"><div class="row"><button class="selected" data-root="models">模型 models</button><button data-root="datasets">数据 datasets</button></div><span id="space" class="muted"></span></div><p id="current" class="path"></p><div class="row spread"><div class="row"><button id="up">上一级</button><button id="home">根目录</button><button id="copy-current">复制当前路径</button><button id="copy-relative">复制相对路径</button></div><div class="row"><input id="filter" placeholder="筛选当前目录" aria-label="筛选当前目录"><button id="mkdir" class="primary">新建文件夹</button></div></div></section>
<div id="status" role="status" aria-live="polite"></div>
<section class="card" id="listing"><div class="table-wrap"><table><thead><tr><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody id="items"></tbody></table></div><div id="empty" class="empty" hidden>此目录为空</div></section>
<section class="card" id="trash-panel" hidden><h2>回收站</h2><p class="muted">删除先移入回收站，可恢复到原位置。永久删除会释放空间，且无法恢复。</p><div class="table-wrap"><table><thead><tr><th>原路径</th><th>删除时间</th><th>操作</th></tr></thead><tbody id="trash-items"></tbody></table></div></section>
<dialog id="dialog"><form id="dialog-form"><h2 id="dialog-title"></h2><p id="dialog-description"></p><input id="dialog-input" autocomplete="off" aria-label="名称"><div class="row"><button type="button" id="cancel">取消</button><button type="submit" class="primary" id="confirm">确定</button></div></form></dialog>
</main><script src="app.js"></script></body></html>
